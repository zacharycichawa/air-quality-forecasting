[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airquality"
version = "0.1.0"
description = "Polish air quality forecasting & AI assistant"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "typer>=0.12",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
airquality = "airquality.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running PostgreSQL (deselect with -m 'not integration')"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
